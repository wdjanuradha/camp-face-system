<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Guardian - Camp Security System (Tactical Edition)</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* --- MODERN MILITARY HUD THEME --- */
:root{ --bg-primary: #030804; --bg-secondary: #0a140a; --bg-card: rgba(10, 25, 15, 0.85); --accent-main: #00ff41; --accent-gold: #ffb300; --accent-danger: #ff003c; --accent-cyan: #00e5ff; --text-primary: #e0e0e0; --text-muted: #6b8e73; --border-color: #1e4d2b; --font-head: 'Black Ops One', cursive; --font-body: 'Share Tech Mono', monospace; --font-ui: 'Rajdhani', sans-serif; }
*{margin:0;padding:0;box-sizing:border-box}
body{ font-family: var(--font-body); background-color: var(--bg-primary); background-image: radial-gradient(circle at 50% 50%, rgba(0, 255, 65, 0.05) 0%, transparent 60%), linear-gradient(rgba(0, 10, 0, 0.85), rgba(0, 5, 0, 0.95)); color: var(--text-primary); min-height:100vh; padding:20px; overflow-x: hidden; }
.lockdown-mode { animation: lockdownFlash 1s infinite; }
@keyframes lockdownFlash { 0% { background-color: #220000; } 50% { background-color: #660000; box-shadow: inset 0 0 100px rgba(255,0,0,0.5); } 100% { background-color: #220000; } }
.container{max-width:1400px;margin:0 auto; position: relative; z-index: 10;}
.hidden{display:none!important}
.header{ background: linear-gradient(90deg, var(--bg-secondary) 0%, rgba(30,77,43,0.4) 100%); border-left: 5px solid var(--accent-gold); border-bottom: 2px solid var(--accent-main); padding:25px; margin-bottom:25px; display:flex; justify-content:space-between; align-items:center; gap:15px; flex-wrap:wrap; box-shadow: 0 5px 20px rgba(0, 255, 65, 0.1); }
.header h1{ font-family: var(--font-head); font-size: 2.5em; color: var(--accent-main); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 255, 65, 0.5); }
.header p{ color: var(--text-muted); font-family: var(--font-ui); text-transform: uppercase; letter-spacing: 2px; font-weight: bold;}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{ background: rgba(0,0,0,0.8); border: 1px solid var(--border-color); color: var(--accent-gold); padding:8px 15px; font-family: var(--font-body); font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; border-radius: 3px;}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;}
.tab{ padding:12px 25px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); color: var(--text-muted); cursor:pointer; font-family: var(--font-ui); font-size: 1.1em; font-weight: 700; text-transform: uppercase; transition: all 0.3s ease; }
.tab.active{ background: var(--accent-main); color: #000; border-color: var(--accent-main); }
.card{ background: var(--bg-card); border: 1px solid var(--border-color); padding:25px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-radius: 4px; margin-bottom: 20px;}
.card h3{ margin-bottom:20px; font-size:1.5em; color: var(--accent-gold); font-family: var(--font-ui); text-transform: uppercase; border-bottom: 1px solid rgba(255,179,0,0.3); padding-bottom: 10px; }
.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
button{ padding:12px 24px; border:none; cursor:pointer; font-family: var(--font-head); text-transform: uppercase; letter-spacing: 1.5px; transition: 0.2s;}
.btn-primary{ background: var(--accent-main); color: #000; }
.btn-danger{ background: var(--accent-danger); color: #fff; }
.btn-secondary{ background: rgba(0,0,0,0.5); border: 1px solid var(--text-muted); color: var(--text-primary); }
/* Tactical Map */
.camp-map { position: relative; width: 100%; max-width: 450px; height: 350px; background: rgba(0, 40, 10, 0.4); border: 2px dashed var(--border-color); margin: 20px auto; }
.perimeter { position: absolute; background: rgba(0, 255, 65, 0.2); border: 1px solid var(--accent-main); display: flex; justify-content: center; align-items: center; font-size: 0.85em; color: var(--accent-main); font-weight: bold; }
.p-north { top: 10px; left: 10px; right: 10px; height: 30px; }
.p-south { bottom: 10px; left: 10px; right: 10px; height: 30px; }
.p-east { top: 45px; right: 10px; bottom: 45px; width: 30px; writing-mode: vertical-rl; }
.p-west { top: 45px; left: 10px; bottom: 45px; width: 30px; writing-mode: vertical-rl; }
.hq-label { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:var(--accent-gold); font-family: var(--font-head); }
@keyframes breachFlash { 0% { background: rgba(255,0,0,0.8); border-color: #fff; color: #fff;} 50% { background: rgba(100,0,0,0.5); } 100% { background: rgba(255,0,0,0.8); } }
.breached { animation: breachFlash 0.4s infinite !important; }
</style>
</head>
<body>
<div class="container">
  <div id="alertArea"></div>
  <div id="loginCard" class="card" style="max-width:520px;margin:10vh auto; text-align:center;">
    <h3>🔐 SENTRY-X SECURE LOGIN</h3>
    <input id="email" type="email" placeholder="officer@army.lk" style="margin-bottom:10px;"/>
    <input id="password" type="password" placeholder="••••••••" style="margin-bottom:20px;"/>
    <button class="btn-primary" id="btnLogin" style="width:100%;">ACCESS GRANTED ➡️</button>
  </div>

  <div id="app" class="hidden">
    <div class="header">
      <div><h1>🛡️ AI Guardian </h1><p>Camp Security System (Tactical Edition)</p></div>
      <div class="pills">
        <div class="pill" id="pillGps">📍 GPS: LOCATING...</div>
        <div class="pill" id="pillRole">RANK: -</div>
        <div class="pill" id="pillGateStatus">🔌 GATE: NO LINK</div> 
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="dashboard">📊 DASHBOARD</button>
      <button class="tab" data-tab="camera">📹 LIVE FEED</button>
      <button class="tab" data-tab="persons">👥 TROOPS</button>
      <button class="tab" data-tab="logs">📋 LOGS</button>
    </div>

    <div id="tab-dashboard" class="tab-content">
      <button id="btnPanic" class="btn-danger" style="width:100%; margin-bottom: 20px;">🚨 BASE LOCKDOWN 🚨</button>
      <div class="grid">
        <div class="card">
          <h3>🗺️ TACTICAL MAP</h3>
          <div class="camp-map">
            <div id="wall-NORTH" class="perimeter p-north">NORTH</div>
            <div id="wall-EAST" class="perimeter p-east">EAST</div>
            <div id="wall-SOUTH" class="perimeter p-south">SOUTH</div>
            <div id="wall-WEST" class="perimeter p-west">WEST</div>
            <div class="hq-label">HQ</div>
          </div>
        </div>
        <div class="card">
          <h3>🔌 HARDWARE</h3>
          <button id="btnConnectArduino" class="btn-primary" style="width:100%;">CONNECT HARDWARE</button>
          <div id="hardwareStatus" class="badge no" style="margin-top:10px;">DISCONNECTED</div>
        </div>
      </div>
    </div>

    <div id="tab-camera" class="tab-content hidden">
      <div class="card">
        <video id="video" autoplay muted playsinline></video>
        <button id="btnStartCam" class="btn-primary">START CAM</button>
        <button id="btnStopCam" class="btn-secondary">STOP CAM</button>
      </div>
    </div>
    <div id="tab-persons" class="tab-content hidden"><div class="card"><h3>👥 TROOPS</h3><div id="personsList"></div></div></div>
    <div id="tab-logs" class="tab-content hidden"><div class="card"><h3>📋 LOGS</h3><div id="logsBody"></div></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================
   CORE LOGIC
========================= */
const el = (id)=>document.getElementById(id);
const sb = (window.supabase || window.supabaseJs).createClient("https://hhmchdaqlwghdgultkgf.supabase.co", "sb_publishable_a7boZvmQp7JWOC8S6G_McA_yGW8zVpy");
let serialPort, serialWriter, isLockdown = false;

function safeAddEvent(id, event, func) {
  const btn = el(id);
  if (btn) btn.addEventListener(event, func);
}

// ARDUINO & SENSORS
async function connectArduino() {
  try {
    serialPort = await navigator.serial.requestPort();
    await serialPort.open({ baudRate: 9600 });
    serialWriter = serialPort.writable.getWriter();
    el("hardwareStatus").textContent = "ONLINE";
    el("hardwareStatus").className = "badge ok";
    listenToArduino();
  } catch (e) { alert("Hardware Error"); }
}

async function listenToArduino() {
  const reader = serialPort.readable.getReader();
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    const decoder = new TextDecoder().decode(value);
    const signals = decoder.split('\n');
    for(let signal of signals) {
      signal = signal.trim();
      if (signal.startsWith("BREACH_")) {
        let [side, dist] = signal.split("_")[1].split(":");
        triggerPerimeterAlarm(side, dist);
      }
    }
  }
}

function triggerPerimeterAlarm(side, distance) {
  const wall = el("wall-" + side);
  if (wall) {
    wall.classList.add("breached");
    wall.innerHTML = distance ? `🚨 ${distance}cm` : "🚨 BREACH!";
    setTimeout(() => { wall.classList.remove("breached"); wall.innerHTML = side; }, 10000);
  }
  if (!isLockdown) el("btnPanic").click();
}

// UI EVENTS
safeAddEvent("btnConnectArduino", "click", connectArduino);
safeAddEvent("btnLogin", "click", async () => { /* Login Logic here */ el("loginCard").classList.add("hidden"); el("app").classList.remove("hidden"); });
safeAddEvent("btnStartCam", "click", () => { /* Cam Logic here */ });
safeAddEvent("btnPanic", "click", () => {
  isLockdown = !isLockdown;
  el("btnPanic").innerHTML = isLockdown ? "❌ CANCEL LOCKDOWN" : "🚨 BASE LOCKDOWN 🚨";
});

// Tab Logic
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-content").forEach(x => x.classList.add("hidden"));
    if(el("tab-"+btn.dataset.tab)) el("tab-"+btn.dataset.tab).classList.remove("hidden");
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  });
});
</script>
</body>
</html>
