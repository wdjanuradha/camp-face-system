<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camp Face Detection System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; text-align: center; }
video { border: 2px solid black; }
canvas { position:absolute; left:50%; transform:translateX(-50%); }
button { padding: 8px; margin: 5px; }
table { margin:auto; border-collapse: collapse; }
td, th { border:1px solid black; padding:5px; }
.hidden { display:none; }
.status { font-weight:bold; }
.green { color:green; }
.red { color:red; }
.orange { color:orange; }
</style>
</head>

<body>

<h2>Camp Face Detection & Entry–Exit System</h2>

<!-- PASSWORD -->
<div id="lockScreen">
  <h3>Password</h3>
  <input type="password" id="passwordInput">
  <button onclick="unlock()">Unlock</button>
</div>

<div id="system" class="hidden">

<!-- STATUS PANEL -->
<h3>System Status</h3>
<p class="status">Models: <span id="modelStatus" class="orange">Loading...</span></p>
<p class="status">Camera: <span id="cameraStatus" class="red">OFF</span></p>
<p class="status">Face: <span id="faceStatus" class="red">Not Detected</span></p>

<button id="startCamera">Start Camera</button>
<button id="downloadCSV">Download CSV</button>

<br><br>

<div style="position:relative; width:320px; margin:auto;">
  <video id="video" width="320" height="240" autoplay muted></video>
  <canvas id="overlay" width="320" height="240"></canvas>
</div>

<h3>Enroll Officers</h3>
<div id="enrollButtons"></div>

<p>
Known: <span id="known">0</span> |
Unknown: <span id="unknown">0</span> |
Total: <span id="total">0</span>
</p>

<h3>Entry / Exit Log</h3>
<table>
<thead>
<tr><th>Name</th><th>Action</th><th>Time</th></tr>
</thead>
<tbody id="logTable"></tbody>
</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
/* CONFIG */
const SYSTEM_PASSWORD = "camp123";
const EXIT_TIMEOUT = 5000;

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

const officers = [
  { name: "Officer 1", descriptors: [] },
  { name: "Officer 2", descriptors: [] },
  { name: "Officer 3", descriptors: [] }
];

let faceMatcher = null;
let lastSeen = {};
let logs = [];
let modelsLoaded = false;
let cameraOn = false;
let faceDetected = false;

/* PASSWORD */
function unlock() {
  if (passwordInput.value === SYSTEM_PASSWORD) {
    lockScreen.classList.add("hidden");
    system.classList.remove("hidden");
  } else alert("Wrong password");
}

/* LOAD MODELS */
Promise.all([
  faceapi.nets.tinyFaceDetector.loadFromUri("models"),
  faceapi.nets.faceLandmark68Net.loadFromUri("models"),
  faceapi.nets.faceRecognitionNet.loadFromUri("models")
]).then(() => {
  modelsLoaded = true;
  modelStatus.innerText = "Loaded";
  modelStatus.className = "green";
  createEnrollButtons();
});

/* CAMERA */
startCamera.onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({ video:true });
  video.srcObject = stream;
  cameraOn = true;
  cameraStatus.innerText = "ON";
  cameraStatus.className = "green";
  startDetection();
};

/* ENROLL BUTTONS */
function createEnrollButtons() {
  enrollButtons.innerHTML = "";
  officers.forEach((o,i) => {
    const btn = document.createElement("button");
    btn.innerText = "Enroll " + o.name;
    btn.disabled = true;
    btn.onclick = () => enrollOfficer(i);
    enrollButtons.appendChild(btn);
  });
}

/* ENABLE BUTTONS WHEN FACE DETECTED */
function updateEnrollButtons() {
  document.querySelectorAll("#enrollButtons button")
    .forEach(b => b.disabled = !faceDetected);
}

/* ENROLL */
async function enrollOfficer(index) {
  const det = await faceapi
    .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold:0.6 }))
    .withFaceDescriptor();

  if (!det) return alert("No face detected");

  officers[index].descriptors.push(det.descriptor);
  faceMatcher = new faceapi.FaceMatcher(
    officers.map(o => new faceapi.LabeledFaceDescriptors(o.name, o.descriptors)), 0.55
  );

  alert(officers[index].name + " enrolled");
}

/* DETECTION LOOP */
function startDetection() {
  setInterval(async () => {
    const detections = await faceapi
      .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold:0.6 }))
      .withFaceDescriptors();

    ctx.clearRect(0,0,canvas.width,canvas.height);

    faceDetected = detections.length > 0;
    faceStatus.innerText = faceDetected ? "Detected" : "Not Detected";
    faceStatus.className = faceDetected ? "green" : "red";
    updateEnrollButtons();

    let known = 0, unknown = 0;
    const now = Date.now();

    detections.forEach(d => {
      let label = "Unknown";
      if (faceMatcher) label = faceMatcher.findBestMatch(d.descriptor).label;

      const box = d.detection.box;
      ctx.strokeStyle = label === "Unknown" ? "red" : "green";
      ctx.strokeRect(box.x, box.y, box.width, box.height);
      ctx.fillText(label, box.x, box.y - 5);

      if (label === "Unknown") unknown++;
      else {
        known++;
        if (!lastSeen[label]) log(label,"ENTER");
        lastSeen[label] = now;
      }
    });

    for (let n in lastSeen) {
      if (now - lastSeen[n] > EXIT_TIMEOUT) {
        log(n,"EXIT");
        delete lastSeen[n];
      }
    }

    knownSpan.innerText = known;
    unknownSpan.innerText = unknown;
    totalSpan.innerText = detections.length;
  }, 800);
}

/* LOGGING */
function log(name, action) {
  const time = new Date().toLocaleString();
  logs.push({name,action,time});
  const r = document.createElement("tr");
  r.innerHTML = `<td>${name}</td><td>${action}</td><td>${time}</td>`;
  logTable.appendChild(r);
}

/* CSV */
downloadCSV.onclick = () => {
  let csv = "Name,Action,Time\n";
  logs.forEach(l => csv += `${l.name},${l.action},${l.time}\n`);
  const b = new Blob([csv],{type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "camp_log.csv";
  a.click();
};
</script>

</body>
</html>
