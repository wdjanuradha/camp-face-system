<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camp Face Detection System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; text-align: center; }
video { border: 2px solid black; }
button { padding: 10px; margin: 5px; }
table { margin: auto; border-collapse: collapse; }
td, th { border: 1px solid black; padding: 5px; }
</style>
</head>

<body>

<h2>Camp Face Detection & Entry–Exit System</h2>

<button id="startCamera">Start Camera</button>
<button id="downloadCSV">Download Log CSV</button>

<br><br>

<video id="video" width="320" height="240" autoplay muted></video>

<h3>Enroll Officers</h3>
<div id="enrollButtons"></div>

<p>
Known: <span id="known">0</span> |
Unknown: <span id="unknown">0</span> |
Total: <span id="total">0</span>
</p>

<h3>Entry / Exit Log</h3>
<table>
<thead>
<tr><th>Name</th><th>Action</th><th>Time</th></tr>
</thead>
<tbody id="logTable"></tbody>
</table>

<!-- Face API -->
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
const video = document.getElementById("video");
const logTable = document.getElementById("logTable");

const officers = [
  { name: "Officer 1", descriptors: [] },
  { name: "Officer 2", descriptors: [] },
  { name: "Officer 3", descriptors: [] },
  { name: "Officer 4", descriptors: [] },
  { name: "Officer 5", descriptors: [] }
];

let faceMatcher = null;
let lastSeen = {};
let logs = [];

// Load models
Promise.all([
  faceapi.nets.tinyFaceDetector.loadFromUri("models"),
  faceapi.nets.faceLandmark68Net.loadFromUri("models"),
  faceapi.nets.faceRecognitionNet.loadFromUri("models")
]).then(() => {
  createEnrollButtons();
  alert("Models loaded");
});

// Start camera
document.getElementById("startCamera").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    startDetection();
  } catch (e) {
    alert("Camera error: " + e);
  }
};

// Create enroll buttons
function createEnrollButtons() {
  const div = document.getElementById("enrollButtons");
  officers.forEach((o, i) => {
    const btn = document.createElement("button");
    btn.innerText = "Enroll " + o.name;
    btn.onclick = () => enrollOfficer(i);
    div.appendChild(btn);
  });
}

// Enroll officer (tap 3–5 times)
async function enrollOfficer(index) {
  const detection = await faceapi
    .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.6 }))
    .withFaceDescriptor();

  if (!detection) {
    alert("No face detected");
    return;
  }

  officers[index].descriptors.push(detection.descriptor);

  faceMatcher = new faceapi.FaceMatcher(
    officers.map(o => new faceapi.LabeledFaceDescriptors(o.name, o.descriptors)),
    0.55 // better accuracy
  );

  alert(officers[index].name + " enrolled");
}

// Detection loop
function startDetection() {
  setInterval(async () => {
    const detections = await faceapi
      .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.6 }))
      .withFaceDescriptors();

    let known = 0;
    let unknown = 0;
    const now = Date.now();

    detections.forEach(d => {
      let label = "Unknown";

      if (faceMatcher) {
        const result = faceMatcher.findBestMatch(d.descriptor);
        label = result.label;
      }

      if (label === "Unknown") {
        unknown++;
      } else {
        known++;
        if (!lastSeen[label]) {
          logAction(label, "ENTER");
        }
        lastSeen[label] = now;
      }
    });

    // Exit detection (if not seen for 5 seconds)
    for (let name in lastSeen) {
      if (now - lastSeen[name] > 5000) {
        logAction(name, "EXIT");
        delete lastSeen[name];
      }
    }

    document.getElementById("known").innerText = known;
    document.getElementById("unknown").innerText = unknown;
    document.getElementById("total").innerText = detections.length;
  }, 1000);
}

// Log entry / exit
function logAction(name, action) {
  const time = new Date().toLocaleString();
  logs.push({ name, action, time });

  const row = document.createElement("tr");
  row.innerHTML = `<td>${name}</td><td>${action}</td><td>${time}</td>`;
  logTable.appendChild(row);
}

// Download CSV
document.getElementById("downloadCSV").onclick = () => {
  let csv = "Name,Action,Time\n";
  logs.forEach(l => {
    csv += `${l.name},${l.action},${l.time}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "camp_entry_exit_log.csv";
  a.click();
};
</script>

</body>
</html>
