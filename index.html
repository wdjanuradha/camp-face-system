<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Camp Face System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; text-align:center; }
video, canvas { border:2px solid black; }
canvas { position:absolute; left:50%; transform:translateX(-50%); }
button { margin:4px; padding:8px; }
.hidden { display:none; }
.green { color:green; }
.red { color:red; }
.orange { color:orange; }
</style>
</head>

<body>

<h2>Camp Face Detection System</h2>

<div id="lock">
<input type="password" id="pwd" placeholder="Password">
<button onclick="unlock()">Unlock</button>
</div>

<div id="system" class="hidden">

<h3>Status</h3>
Models: <span id="modelSt" class="orange">Loading</span><br>
Camera: <span id="camSt" class="red">OFF</span><br>
Face: <span id="faceSt" class="red">No</span><br>
Face Condition: <span id="maskSt" class="orange">Unknown</span><br>
Gate Mode: <span id="gateSt" class="green">IN</span>

<br><br>

<button onclick="setGate('IN')">IN Gate</button>
<button onclick="setGate('OUT')">OUT Gate</button>
<br><br>

<button onclick="startCam()">Start Camera</button>

<div style="position:relative;width:320px;margin:auto;">
<video id="video" width="320" height="240" autoplay muted></video>
<canvas id="can" width="320" height="240"></canvas>
</div>

<h3>Enroll Officers</h3>
<button disabled onclick="enroll(0)">Enroll Officer 1</button>
<button disabled onclick="enroll(1)">Enroll Officer 2</button>
<button disabled onclick="enroll(2)">Enroll Officer 3</button>

<h3>Logs</h3>
<table border="1" align="center">
<tr><th>Name</th><th>Action</th><th>Time</th></tr>
<tbody id="log"></tbody>
</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
const PASS="camp123";
let gate="IN";
let matcher=null;
let lastSeen={};
let officers=[
 {name:"Officer 1",desc:[]},
 {name:"Officer 2",desc:[]},
 {name:"Officer 3",desc:[]}
];

const video=document.getElementById("video");
const ctx=document.getElementById("can").getContext("2d");

function speak(t){
  speechSynthesis.speak(new SpeechSynthesisUtterance(t));
}

function unlock(){
 if(pwd.value===PASS){
  lock.classList.add("hidden");
  system.classList.remove("hidden");
 }
}

function setGate(g){
 gate=g;
 gateSt.innerText=g;
}

Promise.all([
 faceapi.nets.tinyFaceDetector.loadFromUri("models"),
 faceapi.nets.faceLandmark68Net.loadFromUri("models"),
 faceapi.nets.faceRecognitionNet.loadFromUri("models")
]).then(()=>{
 modelSt.innerText="Loaded";
 modelSt.className="green";
});

async function startCam(){
 const s=await navigator.mediaDevices.getUserMedia({video:true});
 video.srcObject=s;
 camSt.innerText="ON";
 camSt.className="green";
 detectLoop();
}

function checkMaskHelmet(lm){
 if(!lm.getMouth().length || !lm.getNose().length) return "MASK";
 if(lm.getJawOutline()[0].y < lm.getLeftEye()[0].y) return "HELMET";
 return "CLEAR";
}

async function enroll(i){
 const d=await faceapi.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions())
 .withFaceLandmarks().withFaceDescriptor();
 if(!d) return alert("No face");
 if(checkMaskHelmet(d.landmarks)!=="CLEAR")
   return alert("Remove mask/helmet");
 officers[i].desc.push(d.descriptor);
 matcher=new faceapi.FaceMatcher(
   officers.map(o=>new faceapi.LabeledFaceDescriptors(o.name,o.desc)),0.55
 );
 alert(officers[i].name+" enrolled");
}

async function detectLoop(){
 setInterval(async()=>{
  const ds=await faceapi.detectAllFaces(video,new faceapi.TinyFaceDetectorOptions())
  .withFaceLandmarks().withFaceDescriptors();
  ctx.clearRect(0,0,320,240);

  faceSt.innerText=ds.length?"Yes":"No";
  faceSt.className=ds.length?"green":"red";

  document.querySelectorAll("button[onclick^='enroll']")
   .forEach(b=>b.disabled=!ds.length);

  ds.forEach(d=>{
   let label="Unknown";
   let cond=checkMaskHelmet(d.landmarks);
   maskSt.innerText=cond;
   maskSt.className=cond==="CLEAR"?"green":"red";

   if(cond!=="CLEAR") return;

   if(matcher) label=matcher.findBestMatch(d.descriptor).label;
   const b=d.detection.box;
   ctx.strokeStyle=label==="Unknown"?"red":"green";
   ctx.strokeRect(b.x,b.y,b.width,b.height);
   ctx.fillText(label,b.x,b.y-5);

   if(label!=="Unknown"){
    if(!lastSeen[label]){
     log(label,gate);
     speak(`Officer ${gate.toLowerCase()}`);
    }
    lastSeen[label]=Date.now();
   }else{
    speak("Unknown person detected");
   }
  });
 },900);
}

function log(n,a){
 const t=new Date().toLocaleString();
 log.innerHTML+=`<tr><td>${n}</td><td>${a}</td><td>${t}</td></tr>`;
}
</script>

</body>
</html>
