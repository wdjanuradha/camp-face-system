<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI GUARDIAN - EXTERNAL PANEL</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
/* --- HIGH-TECH COMMAND CENTER THEME --- */
:root {
  --bg-dark: #020502;
  --neon-green: #00ff41;
  --neon-red: #ff003c;
  --neon-blue: #00e5ff;
  --neon-gold: #ffb300;
  --panel-bg: rgba(0, 20, 10, 0.7);
  --border-neon: rgba(0, 255, 65, 0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-dark);
  color: var(--neon-green);
  font-family: 'Share Tech Mono', monospace;
  overflow: hidden; 
  background-image: 
    linear-gradient(rgba(0, 10, 0, 0.8), rgba(0, 20, 0, 0.9)),
    url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
}

/* CRT Scanline Effect */
body::after {
  content: " "; display: block; position: fixed;
  top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
  z-index: 999; pointer-events: none;
}

.container {
  display: grid; grid-template-columns: 1.5fr 1fr; grid-template-rows: 80px 1fr 1fr; gap: 20px; height: 100vh; padding: 20px;
}

/* HEADER */
.header {
  grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center;
  border-bottom: 3px solid var(--neon-green); box-shadow: 0 5px 15px var(--border-neon); padding: 0 20px; background: var(--panel-bg);
}
.header h1 { font-family: 'Black Ops One', cursive; font-size: 2.5rem; letter-spacing: 4px; text-shadow: 0 0 10px var(--neon-green); }
.header .clock { font-size: 1.5rem; color: var(--neon-blue); }

/* BOX STYLES */
.box { background: var(--panel-bg); border: 1px solid var(--border-neon); position: relative; padding: 20px; display: flex; flex-direction: column; }
.box::before { content: ""; position: absolute; top: -2px; left: -2px; width: 20px; height: 20px; border-top: 3px solid var(--neon-green); border-left: 3px solid var(--neon-green); }
.box::after { content: ""; position: absolute; bottom: -2px; right: -2px; width: 20px; height: 20px; border-bottom: 3px solid var(--neon-green); border-right: 3px solid var(--neon-green); }
.box-title { font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; text-transform: uppercase; color: var(--neon-gold); border-bottom: 1px dashed var(--border-neon); padding-bottom: 5px; margin-bottom: 15px; }

/* STATUS SCREEN */
.status-screen { grid-column: 1; grid-row: 2 / 4; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: all 0.3s ease; }
.status-text { font-family: 'Black Ops One', cursive; font-size: 4rem; letter-spacing: 5px; text-shadow: 0 0 20px currentColor; margin-bottom: 20px; }
.id-card { display: none; width: 80%; border: 2px solid currentColor; padding: 20px; background: rgba(0,0,0,0.6); text-align: left; }
.id-card h2 { font-size: 2.5rem; margin-bottom: 10px; font-family: 'Rajdhani', sans-serif; }
.id-card p { font-size: 1.5rem; margin-bottom: 5px; color: #fff; }

/* AI VOICE WAVEFORM ANIMATION */
.voice-wave { display: none; align-items: center; gap: 5px; margin-top: 20px; }
.voice-wave span { display: block; width: 8px; height: 20px; background: var(--neon-blue); border-radius: 4px; animation: wave 1s infinite ease-in-out; }
.voice-wave span:nth-child(2) { animation-delay: 0.1s; } .voice-wave span:nth-child(3) { animation-delay: 0.2s; } .voice-wave span:nth-child(4) { animation-delay: 0.3s; } .voice-wave span:nth-child(5) { animation-delay: 0.4s; }
@keyframes wave { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(2.5); background: var(--neon-gold); } }
.ai-subtitles { font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; color: var(--neon-gold); margin-top: 15px; display: none; background: rgba(0,0,0,0.8); padding: 10px 20px; border: 1px solid var(--neon-gold); border-radius: 5px; }

/* RADAR */
.radar { width: 200px; height: 200px; border: 2px solid var(--neon-green); border-radius: 50%; position: relative; overflow: hidden; box-shadow: 0 0 20px var(--border-neon); }
.radar::before { content: ""; position: absolute; top: 0; left: 50%; width: 50%; height: 100%; background: linear-gradient(90deg, rgba(0,255,65,0) 0%, rgba(0,255,65,0.5) 100%); transform-origin: left center; animation: radarScan 2s linear infinite; }
@keyframes radarScan { 100% { transform: rotate(360deg); } }

/* 3D GATE - SYNCED TO 45 DEGREES */
.gate-section { display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; }
.gate-container { position: relative; width: 100%; height: 150px; display: flex; align-items: flex-end; padding-left: 50px; }
.gate-pillar { width: 30px; height: 100px; background: #444; border: 2px solid #666; position: relative; z-index: 2; }
.gate-arm { width: 250px; height: 15px; background: repeating-linear-gradient(45deg, #ff0000, #ff0000 15px, #ffffff 15px, #ffffff 30px); position: absolute; left: 65px; bottom: 85px; transform-origin: left center; transform: rotate(0deg); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 5px 10px rgba(0,0,0,0.8); }
/* මෙතනින් තමයි අංශක 45ට ගේට්ටුව ඇරෙන්නේ */
.gate-arm.open { transform: rotate(-45deg); }
.gate-light { width: 15px; height: 15px; border-radius: 50%; background: var(--neon-red); position: absolute; top: 5px; left: 7.5px; box-shadow: 0 0 10px var(--neon-red); }
.gate-light.green { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }

/* LOGS */
.logs-section { overflow: hidden; }
.log-list { list-style: none; font-size: 1.1rem; }
.log-item { padding: 10px; border-bottom: 1px solid var(--border-neon); display: flex; justify-content: space-between; animation: slideIn 0.5s ease-out; }
.log-item.granted { color: var(--neon-green); } .log-item.denied { color: var(--neon-red); }
@keyframes slideIn { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* STATE CLASSES */
.state-idle { color: var(--neon-green); border-color: var(--neon-green); }
.state-granted { color: var(--neon-green); border-color: var(--neon-green); background: rgba(0, 255, 65, 0.1); }
.state-denied { color: var(--neon-red); border-color: var(--neon-red); background: rgba(255, 0, 60, 0.1); }

/* INVISIBLE BUTTON FOR AUDIO PLAYBACK POLICY */
#audioStarter { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; cursor: pointer; }
#audioStarter h2 { color: var(--neon-gold); font-family: 'Rajdhani', sans-serif; border: 2px solid var(--neon-gold); padding: 20px; }
</style>
</head>
<body>

<div id="audioStarter" onclick="initPanel()">
  <h2>SYSTEM READY - CLICK HERE TO INITIALIZE AI COMMS</h2>
</div>

<div class="container">
  <div class="header">
    <h1>AI GUARDIAN <span style="font-size:1.2rem; color:var(--text-muted)">// JUDGE PANEL</span></h1>
    <div class="clock" id="clock">00:00:00</div>
  </div>

  <div class="box status-screen state-idle" id="statusBox">
    <div class="radar" id="radar"></div>
    <div class="status-text" id="statusText">SCANNING...</div>
    
    <div class="id-card" id="idCard">
      <h2 id="cardName">JOHN DOE</h2>
      <p style="color:var(--neon-gold)" id="cardRank">RANK: SGT</p>
      <p id="cardSvc">SVC: SLLI/0000</p>
      <p style="margin-top:10px; font-size:1.2rem; opacity:0.8" id="cardMsg">Clearance Verified.</p>
    </div>

    <div class="voice-wave" id="voiceWave">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="ai-subtitles" id="aiSubtitles"></div>
  </div>

  <div class="box gate-section">
    <div class="box-title">PHYSICAL GATE STATUS</div>
    <div class="gate-container">
      <div class="gate-pillar"><div class="gate-light" id="gateLight"></div></div>
      <div class="gate-arm" id="gateArm"></div>
    </div>
    <h2 id="gateText" style="margin-top:20px; color:var(--neon-red); font-family: 'Rajdhani', sans-serif;">RESTRICTED - CLOSED</h2>
  </div>

  <div class="box logs-section">
    <div class="box-title">RECENT ACTIVITY LOG</div>
    <ul class="log-list" id="logList">
      <li class="log-item"><span style="color:#fff">SYSTEM INIT</span> <span>READY</span></li>
    </ul>
  </div>
</div>

<script>
function initPanel() {
  document.getElementById('audioStarter').style.display = 'none';
  const unlockSpeech = new SpeechSynthesisUtterance("System Initialized");
  unlockSpeech.volume = 0; 
  window.speechSynthesis.speak(unlockSpeech);
}

setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);

const statusBox = document.getElementById('statusBox'); const statusText = document.getElementById('statusText');
const radar = document.getElementById('radar'); const idCard = document.getElementById('idCard');
const cardName = document.getElementById('cardName'); const cardRank = document.getElementById('cardRank');
const cardSvc = document.getElementById('cardSvc'); const cardMsg = document.getElementById('cardMsg');
const gateArm = document.getElementById('gateArm'); const gateLight = document.getElementById('gateLight');
const gateText = document.getElementById('gateText'); const logList = document.getElementById('logList');
const voiceWave = document.getElementById('voiceWave'); const aiSubtitles = document.getElementById('aiSubtitles');

let resetTimeout;
const broadcast = new BroadcastChannel('sentryx_panel');

broadcast.onmessage = (event) => {
  try {
    const { type, payload } = event.data;
    clearTimeout(resetTimeout);
    window.speechSynthesis.cancel(); 

    // දත්ත කියවීමේ දෝෂ වැළැක්වීමේ ආරක්ෂිත පියවර (Safe Parsing)
    let p = null;
    if (payload && payload.person) {
      p = payload.person;
    } else if (payload) {
      p = payload; 
    }

    if (type === 'ACCESS_GRANTED') {
      triggerGranted(p);
      addLog(p && p.name ? p.name : 'AUTHORIZED OFFICER', 'ACCESS GRANTED', 'granted');
      speakSinhala(p, true);
      
      // තත්පර 5.5ක් ගේට්ටුව ඇරී තිබීමට සකසා ඇත (Arduino එකේ ටයිමින් එකට සමානව)
      resetTimeout = setTimeout(resetUI, 5500); 
    } 
    else if (type === 'ACCESS_DENIED') {
      triggerDenied(payload.message, p);
      addLog(p && p.name ? p.name : 'UNKNOWN', 'ACCESS DENIED', 'denied');
      speakSinhala(p, false);
      
      resetTimeout = setTimeout(resetUI, 4000);
    }
  } catch (error) {
    console.error("Broadcast Error: ", error);
  }
};

function triggerGranted(person) {
  statusBox.className = "box status-screen state-granted";
  statusText.textContent = "ACCESS GRANTED";
  radar.style.display = "none"; 
  idCard.style.display = "block"; 
  idCard.style.borderColor = "var(--neon-green)";
  
  // දත්ත නොමැති වුවත් පද්ධතිය Crash නොවන පරිදි සකසා ඇත
  cardName.textContent = (person && person.name) ? person.name.toUpperCase() : "AUTHORIZED OFFICER";
  cardRank.textContent = `RANK: ${(person && person.rank) ? person.rank.toUpperCase() : '-'}`;
  cardSvc.textContent = `SVC: ${(person && person.service_no) ? person.service_no : '-'}`;
  cardMsg.textContent = "CLEARANCE VERIFIED - PROCEED"; 
  cardMsg.style.color = "var(--neon-green)";

  // ගේට්ටුව ඇරීමේ ඇනිමේෂන් එක ක්‍රියාත්මක කිරීම
  gateArm.classList.add('open'); 
  gateLight.classList.add('green');
  gateText.textContent = "GATE OPEN - PROCEED"; 
  gateText.style.color = "var(--neon-green)";
}

function triggerDenied(message, person) {
  statusBox.className = "box status-screen state-denied";
  statusText.textContent = "ACCESS DENIED";
  radar.style.display = "none"; 
  idCard.style.display = "block"; 
  idCard.style.borderColor = "var(--neon-red)";
  
  if (person && person.name) {
    cardName.textContent = person.name.toUpperCase();
    cardRank.textContent = `RANK: ${person.rank ? person.rank.toUpperCase() : '-'}`;
    cardSvc.textContent = `SVC: ${person.service_no ? person.service_no : '-'}`;
  } else {
    cardName.textContent = "UNKNOWN ENTITY"; 
    cardRank.textContent = ""; 
    cardSvc.textContent = "NO RECORD FOUND";
  }
  
  cardMsg.textContent = (message ? message.toUpperCase() : "UNAUTHORIZED") + " - STAND DOWN"; 
  cardMsg.style.color = "var(--neon-red)";

  gateArm.classList.remove('open'); 
  gateLight.classList.remove('green');
  gateText.textContent = "RESTRICTED - CLOSED"; 
  gateText.style.color = "var(--neon-red)";
}

function resetUI() {
  statusBox.className = "box status-screen state-idle"; 
  statusText.textContent = "SCANNING...";
  radar.style.display = "block"; 
  idCard.style.display = "none"; 
  voiceWave.style.display = "none"; 
  aiSubtitles.style.display = "none";
  gateArm.classList.remove('open'); 
  gateLight.classList.remove('green');
  gateText.textContent = "RESTRICTED - CLOSED"; 
  gateText.style.color = "var(--neon-red)";
}

function addLog(name, action, type) {
  const li = document.createElement('li'); 
  li.className = `log-item ${type}`;
  const time = new Date().toLocaleTimeString();
  li.innerHTML = `<span style="color:#fff">[${time}] ${name}</span> <span>${action}</span>`;
  logList.prepend(li); 
  if (logList.children.length > 8) { logList.removeChild(logList.lastChild); }
}

function speakSinhala(person, isGranted) {
  const hour = new Date().getHours();
  let greeting = "";
  
  if (hour >= 5 && hour < 12) { greeting = "සුබ උදෑසනක්"; } 
  else if (hour >= 12 && hour < 17) { greeting = "සුබ දහවලක්"; } 
  else { greeting = "සුබ සන්ධ්‍යාවක්"; }

  let nameAndRank = "";
  if (person && person.name) {
      nameAndRank = (person.rank ? person.rank + " " : "") + person.name;
  } else {
      nameAndRank = "නිලධාරිතුමා";
  }

  let textToSpeak = "";
  if (isGranted) {
    textToSpeak = `${greeting} ${nameAndRank}. ඔබගේ අනන්‍යතාවය තහවුරුයි. කරුණාකර කඳවුරට ඇතුළු වන්න.`;
  } else {
    textToSpeak = "අවධානයයි! ඔබගේ අනන්‍යතාවය තහවුරු කළ නොහැක. කරුණාකර පරීක්ෂාව සඳහා රැඳී සිටින්න.";
  }

  voiceWave.style.display = "flex";
  aiSubtitles.style.display = "block";
  aiSubtitles.textContent = textToSpeak;

  const utterance = new SpeechSynthesisUtterance(textToSpeak);
  utterance.lang = 'si-LK'; 
  utterance.rate = 0.9;     
  utterance.pitch = 1.0;    

  utterance.onend = () => {
    voiceWave.style.display = "none";
    aiSubtitles.style.display = "none";
  };
  window.speechSynthesis.speak(utterance);
}
</script>

</body>
</html>
