<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camp Face Entry System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg:#0f172a;
  --card:#111827;
  --accent:#22c55e;
  --danger:#ef4444;
  --text:#e5e7eb;
}

body {
  margin:0;
  font-family: "Segoe UI", sans-serif;
  background:var(--bg);
  color:var(--text);
  text-align:center;
}

h2 { margin:15px 0; }

.card {
  background:var(--card);
  border-radius:12px;
  padding:15px;
  margin:10px auto;
  width:360px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

button {
  background:var(--accent);
  border:none;
  color:black;
  padding:10px 14px;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  margin:5px;
}

button:disabled {
  background:#374151;
  color:#9ca3af;
}

.status span {
  font-weight:600;
}

.ok { color:var(--accent); }
.bad { color:var(--danger); }

video, canvas {
  border-radius:10px;
}

canvas {
  position:absolute;
  left:50%;
  transform:translateX(-50%);
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:13px;
}

th,td {
  padding:6px;
  border-bottom:1px solid #374151;
}

.hidden { display:none; }
</style>
</head>

<body>

<h2>Camp Face Entry System</h2>

<div class="card" id="lock">
  <input type="password" id="pwd" placeholder="Enter password">
  <br><br>
  <button onclick="unlock()">Unlock</button>
</div>

<div id="system" class="hidden">

<div class="card status">
  Models: <span id="modelSt">Loading…</span><br>
  Camera: <span id="camSt" class="bad">OFF</span><br>
  Face: <span id="faceSt" class="bad">No</span>
</div>

<div class="card">
  <button id="startBtn">Start Camera</button>
  <div style="position:relative;width:320px;margin:auto;">
    <video id="video" width="320" height="240" autoplay muted></video>
    <canvas id="canvas" width="320" height="240"></canvas>
  </div>
</div>

<div class="card">
  <h3>Enroll Officers</h3>
  <button disabled onclick="enroll(0)">Officer 1</button>
  <button disabled onclick="enroll(1)">Officer 2</button>
  <button disabled onclick="enroll(2)">Officer 3</button>
</div>

<div class="card">
  <h3>Entry Log</h3>
  <table>
    <thead><tr><th>Name</th><th>Time</th></tr></thead>
    <tbody id="log"></tbody>
  </table>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
const PASSWORD="camp123";
const video=document.getElementById("video");
const ctx=document.getElementById("canvas").getContext("2d");

let matcher=null;
let lastEntry={};
let speaking=false;

const officers=[
 {name:"Officer 1",desc:[]},
 {name:"Officer 2",desc:[]},
 {name:"Officer 3",desc:[]}
];

function unlock(){
 if(pwd.value===PASSWORD){
  lock.classList.add("hidden");
  system.classList.remove("hidden");
 }
}

function speakOnce(msg){
 if(speaking) return;
 speaking=true;
 speechSynthesis.speak(new SpeechSynthesisUtterance(msg));
 setTimeout(()=>speaking=false,3000);
}

Promise.all([
 faceapi.nets.tinyFaceDetector.loadFromUri("models"),
 faceapi.nets.faceLandmark68Net.loadFromUri("models"),
 faceapi.nets.faceRecognitionNet.loadFromUri("models")
]).then(()=>{
 modelSt.innerText="Loaded";
 modelSt.className="ok";
});

startBtn.onclick=async()=>{
 const s=await navigator.mediaDevices.getUserMedia({video:true});
 video.srcObject=s;
 camSt.innerText="ON";
 camSt.className="ok";
 detectLoop();
};

async function enroll(i){
 const d=await faceapi.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions({
    inputSize:416,
    scoreThreshold:0.3
 })).withFaceDescriptor();
 if(!d) return alert("Face not detected");
 officers[i].desc.push(d.descriptor);
 matcher=new faceapi.FaceMatcher(
   officers.map(o=>new faceapi.LabeledFaceDescriptors(o.name,o.desc)),0.55
 );
 alert(officers[i].name+" enrolled");
}

async function detectLoop(){
 setInterval(async()=>{
  const ds=await faceapi.detectAllFaces(video,new faceapi.TinyFaceDetectorOptions({
    inputSize:416,
    scoreThreshold:0.3
  })).withFaceDescriptors();

  ctx.clearRect(0,0,320,240);

  faceSt.innerText=ds.length?"Yes":"No";
  faceSt.className=ds.length?"ok":"bad";

  document.querySelectorAll("button[onclick^='enroll']")
    .forEach(b=>b.disabled=!ds.length);

  ds.forEach(d=>{
   let label="Unknown";
   if(matcher) label=matcher.findBestMatch(d.descriptor).label;
   const b=d.detection.box;
   ctx.strokeStyle=label==="Unknown"?"red":"lime";
   ctx.strokeRect(b.x,b.y,b.width,b.height);
   ctx.fillText(label,b.x,b.y-5);

   if(label!=="Unknown" && !lastEntry[label]){
    logEntry(label);
    speakOnce("Officer entered");
    lastEntry[label]=true;
    setTimeout(()=>delete lastEntry[label],5000);
   }
  });
 },1000);
}

function logEntry(name){
 const t=new Date().toLocaleString();
 log.innerHTML+=`<tr><td>${name}</td><td>${t}</td></tr>`;
}
</script>

</body>
</html>
